# ===== 开发环境：本地 MySQL，热模板，调试日志 =====
server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/task_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Root@123456
    # 连接池使用 Spring Boot 默认的 HikariCP：
    # 原先指定 type=com.alibaba.druid.pool.DruidDataSource，但 pom 未引入 Druid 依赖，会导致启动失败。
  thymeleaf:
    cache: false

# 环节三：MyBatis-Plus 配置前缀由 mybatis 改为 mybatis-plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl   # 控制台打印真实 SQL，便于观察 Wrapper 生成条件

logging:
  level:
    root: info
    cn.edu.mju.band: debug
