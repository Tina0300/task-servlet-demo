<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>出错了 - 任务管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="center-page">
<div class="card">
    <h2>请求未能完成</h2>
    <p class="alert" th:text="${message != null ? message : '系统开小差了，请稍后重试。'}">系统开小差了，请稍后重试。</p>
    <p class="muted" th:if="${status != null}" th:text="|状态码：${status}|">状态码：500</p>
    <p class="muted" th:if="${path != null}" th:text="|请求路径：${path}|">请求路径：/</p>
    <div class="actions">
        <a class="btn primary" th:href="@{/task}">返回任务列表</a>
        <a class="btn" th:href="@{/login}">重新登录</a>
    </div>
</div>
</body>
</html>
