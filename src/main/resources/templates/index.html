<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>首页 - 任务管理</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="center-page">
<div class="card">
    <h2>欢迎，<span th:text="${session.loginUser != null ? session.loginUser : '访客'}">用户</span></h2>
    <p class="muted">当前时间：<span th:text="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd HH:mm')}">2026-01-01 00:00</span></p>
    <div class="actions">
        <a class="btn primary" th:href="@{/task}">进入任务列表</a>
        <a class="btn" th:href="@{/logout}">退出登录</a>
    </div>
</div>
</body>
</html>
