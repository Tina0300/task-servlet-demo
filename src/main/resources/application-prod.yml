# ===== 生产环境：敏感信息全部走环境变量，模板缓存开启 =====
server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # 连接池使用 Spring Boot 默认的 HikariCP（未显式指定 type，避免依赖 Druid）
  thymeleaf:
    cache: true

logging:
  level:
    root: warn
    cn.edu.mju.band: info
