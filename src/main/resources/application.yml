# ===== 公共配置：所有环境共享 =====
spring:
  application:
    name: task-servlet-demo
  profiles:
    active: dev                 # 默认环境；命令行 --spring.profiles.active=test 可覆盖
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
  web:
    resources:
      static-locations: classpath:/static/

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true

# 环节三：MyBatis-Plus 公共配置（原 mybatis-config.xml 的设置全部并入此处）
# 本项目已不再保留任何 mapper XML；若后续确有复杂 SQL，把 XML 放到 classpath:/mapper/ 下即可被自动加载
mybatis-plus:
  type-aliases-package: cn.edu.mju.band.entity
  configuration:
    map-underscore-to-camel-case: true   # task_date -> taskDate
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: auto                      # 与建表语句的 AUTO_INCREMENT 对齐

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
